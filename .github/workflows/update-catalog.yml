name: Update Manga Catalog

on:
  push:
    branches: ["main", "master"]
    paths:
      - "manga/**"
      - "generate_catalog.py"
      - ".github/workflows/update-catalog.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-catalog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate catalog
        run: python3 generate_catalog.py

      - name: Commit generated catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add manga/catalog.json data.js

          if git diff --cached --quiet; then
            echo "No catalog changes."
          else
            git commit -m "Auto-update manga catalog"
            git push
          fi
